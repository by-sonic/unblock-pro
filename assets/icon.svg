<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- UnblockPro mark: traffic getting through a breach in a barrier.
       Deliberately not a padlock or a shield — this app does not encrypt and is
       not a VPN, so a security metaphor would misrepresent what it does.

       The glyph is authored on the 16-unit grid in assets/tray-icon.svg and only
       scaled here, so the menu-bar icon and the app icon are the same mark, and
       every edge lands on a whole pixel at 16, 32, 64, 128, 256, 512 and 1024. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Light from the top-left keeps the tile from reading as flat colour. -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="28%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Same breach as the tray glyph, in the 16-unit space of the group below. -->
    <mask id="breach">
      <rect x="0" y="0" width="16" height="16" fill="#ffffff"/>
      <rect x="3" y="6" width="8" height="4" rx="1" fill="#000000"/>
    </mask>
    <!-- Units here are the glyph's, so the offsets are fractions of a unit. -->
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.14" stdDeviation="0.16"
                    flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#sheen)"/>

  <!-- 16-unit glyph at 74% of the tile, centred: scale 23.68, offset 66.56. -->
  <g transform="translate(66.56 66.56) scale(23.68)" fill="#ffffff">
    <rect x="5" y="0" width="3" height="16" rx="0.6" mask="url(#breach)"/>
    <!-- The arrow sits in front of the wall, so it casts onto it. Only the large
         raster sizes carry this; at 16px the blur is smaller than a pixel. -->
    <g filter="url(#lift)">
      <rect x="0" y="7" width="11" height="2" rx="1"/>
      <path d="M9.5 4 L16 8 L9.5 12 Z"/>
    </g>
  </g>
</svg>
