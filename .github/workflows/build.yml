name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Ручной запуск: Actions → Build & Release → Run workflow

permissions:
  contents: write

jobs:
  # На push в main — поднять версию и запушить. На push тега — только задать version.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
      commit_sha: ${{ steps.outputs.outputs.commit_sha }}
      should_build: ${{ steps.outputs.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Prepare build version
        id: outputs
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            OLD_VERSION=$(node -p "require('./package.json').version")
            npm version patch --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            if git diff --staged --quiet; then
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "version=$OLD_VERSION" >> $GITHUB_OUTPUT
            else
              git commit -m "chore: bump version to $VERSION [skip ci]"
              git push origin main
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "version=$VERSION" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            if [ "${GITHUB_REF#refs/tags/v}" != "$PACKAGE_VERSION" ]; then
              echo "Tag version does not match package.json" >&2
              exit 1
            fi
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build-mac:
    runs-on: macos-latest
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci

      - name: Run tests
        run: npm test

      - name: Verify elevation API in the actual Electron runtime
        run: npx electron scripts/elevation-smoke.js

      - name: Create bin directory
        run: mkdir -p bin/darwin

      - name: Build universal macOS tpws
        shell: bash
        run: |
          # Single source of truth for which zapret source we compile — the app
          # pins the same commit for its runtime download, so a shipped runtime
          # and a locally built one are the same code.
          COMMIT="$(node -p "require('./src/main/zapret-source').ZAPRET_MACOS_COMMIT")"
          echo "zapret commit: $COMMIT"
          mkdir -p temp/zapret
          git -C temp/zapret init
          git -C temp/zapret fetch --depth 1 https://github.com/bol-van/zapret.git "$COMMIT"
          git -C temp/zapret checkout --detach FETCH_HEAD
          OPTIMIZE=-O2 make -C temp/zapret/tpws mac
          cp temp/zapret/tpws/tpws bin/darwin/tpws
          chmod 755 bin/darwin/tpws
          file bin/darwin/tpws | grep -q 'Mach-O universal binary'

      # The runtime arch check gates every launch: if it rejected the binary we
      # ship, every Mac would fall through to the "recompile locally" path and
      # break. Assert against the real artifact, not a synthetic header.
      - name: Verify arch validation accepts the bundled tpws
        run: |
          node -e "
          const { getMachOCpuTypes, isMachOBinaryRunnable } = require('./src/main/binary-format');
          const target = 'bin/darwin/tpws';
          const types = getMachOCpuTypes(target);
          console.log('detected cpu types:', types.map((t) => '0x' + t.toString(16)).join(', ') || '(none)');
          if (types.length < 2) {
            console.error('expected a universal binary with at least 2 slices');
            process.exit(1);
          }
          for (const arch of ['x64', 'arm64']) {
            if (!isMachOBinaryRunnable(target, arch)) {
              console.error('REJECTED the shipped binary on ' + arch);
              process.exit(1);
            }
            console.log('accepted on', arch);
          }
          "

      # --help never enters the event loop; exercise the actual listener and a
      # local SOCKS5 request without changing any system network settings.
      # Pinned tpws rejects loopback CONNECT by policy; a valid REP=2 is expected.
      - name: Smoke test the bundled tpws SOCKS runtime
        shell: bash
        run: |
          echo "runner arch: $(uname -m), macOS $(sw_vers -productVersion)"
          # Sign the artifact we just compiled, including both universal slices.
          codesign --force --sign - bin/darwin/tpws
          codesign --verify --verbose bin/darwin/tpws
          node scripts/check-mac-runtime.js bin/darwin/tpws

      - name: Build macOS
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          command: npm run build:mac -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged macOS elevation dependency
        run: npx electron scripts/elevation-smoke.js --packaged

      - name: Remove debug files
        run: rm -f dist/builder-debug.yml

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          retention-days: 5

  build-windows:
    runs-on: windows-latest
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci

      - name: Run tests
        run: npm test

      - name: Verify renderer layout and protected-runtime bootstrap
        run: npx electron scripts/renderer-smoke.js

      - name: Verify elevation API in the actual Electron runtime
        run: npx electron scripts/elevation-smoke.js

      - name: Create bin directory
        run: mkdir bin\win32
        shell: cmd

      - name: Bundle audited Flowseal runtime
        shell: pwsh
        run: |
          $bundle = node -e "const b=require('./src/main/flowseal-bundle'); console.log(JSON.stringify({version:b.FLOWSEAL_BUNDLE_VERSION,url:b.FLOWSEAL_BUNDLE_URL,sha256:b.FLOWSEAL_BUNDLE_SHA256}))" | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'flowseal.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'flowseal'
          Invoke-WebRequest -Uri $bundle.url -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne $bundle.sha256) {
            throw "Flowseal checksum mismatch: $hash"
          }
          Expand-Archive -Path $archive -DestinationPath $extract
          Copy-Item -Path "$extract\zapret-discord-youtube-$($bundle.version)\bin\*" -Destination 'bin\win32' -Recurse
          Set-Content -Path 'bin\win32\flowseal-bundle-version.txt' -Value $bundle.version -NoNewline

      - name: Validate every bundled Windows strategy without opening WinDivert
        run: node scripts/check-windows-strategies.js

      - name: Build Windows
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          command: npm run build:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged Windows elevation dependency
        run: npx electron scripts/elevation-smoke.js --packaged

      - name: Remove debug files
        run: del dist\builder-debug.yml 2>nul || true
        shell: cmd

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          retention-days: 5

  release:
    needs: [build-mac, build-windows, prepare]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: artifacts/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-build
          path: artifacts/win

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.commit_sha }}
          name: UnblockPro v${{ needs.prepare.outputs.version }}
          body: |
            ## UnblockPro v${{ needs.prepare.outputs.version }}
            
            ### Скачать
            
            | Платформа | Файл | Описание |
            |-----------|------|----------|
            | **macOS** Apple Silicon (M1/M2/M3/M4) | `UnblockPro-*-mac-arm64.dmg` | Для Mac с M-процессором |
            | **macOS** Intel | `UnblockPro-*-mac-x64.dmg` | Для Mac с Intel |
            | **Windows** | `UnblockPro-*-win-setup.exe` | Установщик |
            Windows: используйте установщик. Portable-запуск отключён, поскольку движок должен находиться в защищённом каталоге Program Files.
            
            ### macOS — первый запуск
            
            После скачивания выполните в Терминале:
            ```
            xattr -cr /Applications/UnblockPro.app
            ```
            
            ---
            **by sonic**
          # The block above is the same in every release, so on its own it never
          # told anyone what actually changed. GitHub appends the real commit and
          # PR list underneath it.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/mac/**/*
            artifacts/win/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
