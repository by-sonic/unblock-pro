name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Ручной запуск: Actions → Build & Release → Run workflow

permissions:
  contents: write

jobs:
  # На push в main — поднять версию и запушить. На push тега — только задать version.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
      should_build: ${{ steps.outputs.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Prepare build version
        id: outputs
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            OLD_VERSION=$(node -p "require('./package.json').version")
            npm version patch --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            if git diff --staged --quiet; then
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "version=$OLD_VERSION" >> $GITHUB_OUTPUT
            else
              git commit -m "chore: bump version to $VERSION [skip ci]"
              git push origin main
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "version=$VERSION" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-mac:
    runs-on: macos-latest
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci

      - name: Run tests
        run: npm test

      - name: Create bin directory
        run: mkdir -p bin/darwin

      - name: Build universal macOS tpws
        shell: bash
        run: |
          mkdir -p temp/zapret
          git -C temp/zapret init
          git -C temp/zapret fetch --depth 1 https://github.com/bol-van/zapret.git 1a1fc38c8ea05b481eebcbd338df48cdcca23c15
          git -C temp/zapret checkout --detach FETCH_HEAD
          OPTIMIZE=-O2 make -C temp/zapret/tpws mac
          cp temp/zapret/tpws/tpws bin/darwin/tpws
          chmod 755 bin/darwin/tpws
          file bin/darwin/tpws | grep -q 'Mach-O universal binary'

      # The runtime arch check gates every launch: if it rejected the binary we
      # ship, every Mac would fall through to the "recompile locally" path and
      # break. Assert against the real artifact, not a synthetic header.
      - name: Verify arch validation accepts the bundled tpws
        run: |
          node -e "
          const { getMachOCpuTypes, isMachOBinaryRunnable } = require('./src/main/binary-format');
          const target = 'bin/darwin/tpws';
          const types = getMachOCpuTypes(target);
          console.log('detected cpu types:', types.map((t) => '0x' + t.toString(16)).join(', ') || '(none)');
          if (types.length < 2) {
            console.error('expected a universal binary with at least 2 slices');
            process.exit(1);
          }
          for (const arch of ['x64', 'arm64']) {
            if (!isMachOBinaryRunnable(target, arch)) {
              console.error('REJECTED the shipped binary on ' + arch);
              process.exit(1);
            }
            console.log('accepted on', arch);
          }
          "

      # A binary that passes every static check and still gets SIGKILLed on exec
      # is exactly what was reported on Apple Silicon (M4, macOS 27): universal,
      # both slices present, dead the moment it runs. The runner is arm64, so
      # actually running it here turns that report into a build gate.
      - name: Verify the bundled tpws can actually execute
        shell: bash
        run: |
          echo "runner arch: $(uname -m), macOS $(sw_vers -productVersion)"

          echo "--- signature ---"
          codesign -dv --verbose=4 bin/darwin/tpws 2>&1 | sed 's/^/  /' || echo "  (codesign reported nothing)"

          echo "--- exec (no GNU timeout on the runner, so watchdog it) ---"
          bin/darwin/tpws --help >"$RUNNER_TEMP/tpws-help.txt" 2>&1 &
          pid=$!
          ( sleep 10; kill -9 $pid 2>/dev/null ) >/dev/null 2>&1 &
          watchdog=$!
          wait $pid 2>/dev/null
          code=$?
          kill $watchdog 2>/dev/null

          head -3 "$RUNNER_TEMP/tpws-help.txt" 2>/dev/null | sed 's/^/  /'
          if [ "$code" -ge 128 ]; then
            echo "FAIL: killed by signal $((code - 128)) on $(uname -m) — the shipped binary cannot run"
            exit 1
          fi
          echo "ok: exited with code $code on $(uname -m)"

      - name: Build macOS
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          command: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove debug files
        run: rm -f dist/builder-debug.yml

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          retention-days: 5

  build-windows:
    runs-on: windows-latest
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci

      - name: Run tests
        run: npm test

      - name: Create bin directory
        run: mkdir bin\win32
        shell: cmd

      - name: Bundle audited Flowseal runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/Flowseal/zapret-discord-youtube/releases/download/1.9.9c/zapret-discord-youtube-1.9.9c.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'flowseal.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'flowseal'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne '6064e4b26ed7358961a0b978fbb6263b119d8d7a5a06bb4a6454aeb855cf63e9') {
            throw "Flowseal checksum mismatch: $hash"
          }
          Expand-Archive -Path $archive -DestinationPath $extract
          Copy-Item -Path "$extract\zapret-discord-youtube-1.9.9c\bin\*" -Destination 'bin\win32' -Recurse
          Set-Content -Path 'bin\win32\flowseal-bundle-version.txt' -Value '1.9.9c' -NoNewline

      - name: Build Windows
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          command: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove debug files
        run: del dist\builder-debug.yml 2>nul || true
        shell: cmd

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          retention-days: 5

  release:
    needs: [build-mac, build-windows, prepare]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: artifacts/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-build
          path: artifacts/win

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: UnblockPro v${{ needs.prepare.outputs.version }}
          body: |
            ## UnblockPro v${{ needs.prepare.outputs.version }}
            
            ### Скачать
            
            | Платформа | Файл | Описание |
            |-----------|------|----------|
            | **macOS** Apple Silicon (M1/M2/M3/M4) | `UnblockPro-*-mac-arm64.dmg` | Для Mac с M-процессором |
            | **macOS** Intel | `UnblockPro-*-mac-x64.dmg` | Для Mac с Intel |
            | **Windows** | `UnblockPro-*-win-setup.exe` | Установщик |
            | **Windows** | `UnblockPro-*-win-portable.exe` | Портативная версия |
            
            ### macOS — первый запуск
            
            После скачивания выполните в Терминале:
            ```
            xattr -cr /Applications/UnblockPro.app
            ```
            
            ---
            **by sonic**
          draft: false
          prerelease: false
          files: |
            artifacts/mac/**/*
            artifacts/win/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
