name: Verify released macOS Firefox and SOCKS behaviour
on:
  push:
    branches: [qa/macos-firefox-issues-20261122]
    paths: ['qa/firefox.py', 'qa/settings.py', 'qa/services.py', '.github/workflows/macos-issue-validation.yml']
permissions:
  contents: read
jobs:
  firefox:
    runs-on: macos-15-intel
    env:
      QA_RELEASE: 2.0.33
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch published Intel runtimes and verify asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          for attempt in {1..24}; do
            if gh release view "v$QA_RELEASE" -R by-sonic/unblock-pro --json assets --jq '.assets | length' | grep -qx 12; then break; fi
            sleep 10
          done
          for v in 2.0.26 "$QA_RELEASE"; do
            file="UnblockPro-$v-mac-x64.zip"
            gh release download "v$v" -R by-sonic/unblock-pro -p "$file"
            sha=$(gh release view "v$v" -R by-sonic/unblock-pro --json assets --jq ".assets[] | select(.name==\"$file\") | .digest")
            test "sha256:$(shasum -a 256 "$file" | cut -d' ' -f1)" = "$sha"
            unzip -p "$file" '*/Contents/Resources/bin/tpws' > "tpws-$v"
            chmod +x "tpws-$v"
            file "tpws-$v"
            codesign --verify "tpws-$v"
          done
      - name: Use the shipped application source and its own test suite
        run: |
          git fetch --depth=1 origin "refs/tags/v$QA_RELEASE"
          git restore --source FETCH_HEAD -- src scripts test
      - name: Qualify macOS app strategy arguments, custom target, recovery and privilege request count
        run: |
          node --test test/proxy-port.test.js test/macos-cleanup.test.js test/mac-network-settings.test.js test/custom-target.test.js test/connectivity-probes.test.js test/service-probe-run.test.js test/strategy-outcome.test.js
          node scripts/check-mac-runtime.js "$RUNNER_TEMP/tpws-$QA_RELEASE"
          python3 qa/strategies.py
      - name: Prepare real Firefox and WebDriver before switching system proxy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -x /Applications/Firefox.app/Contents/MacOS/firefox ]; then
            curl -fsSL --retry 2 'https://download.mozilla.org/?product=firefox-latest-ssl&os=osx&lang=en-US' -o "$RUNNER_TEMP/firefox.dmg"
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/firefox-mount" "$RUNNER_TEMP/firefox.dmg"
            export FIREFOX_BIN="$RUNNER_TEMP/firefox-mount/Firefox.app/Contents/MacOS/firefox"
          else
            export FIREFOX_BIN=/Applications/Firefox.app/Contents/MacOS/firefox
          fi
          echo "FIREFOX_BIN=$FIREFOX_BIN" >> "$GITHUB_ENV"
          "$FIREFOX_BIN" --version
          url=$(gh api repos/mozilla/geckodriver/releases/latest --jq '.assets[] | select(.name|endswith("-macos.tar.gz")) | .browser_download_url')
          curl -fsSL --retry 2 "$url" -o "$RUNNER_TEMP/driver.tar.gz"
          tar -xzf "$RUNNER_TEMP/driver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          "$RUNNER_TEMP/geckodriver" --version
          python3 -m venv "$RUNNER_TEMP/webdriver"
          "$RUNNER_TEMP/webdriver/bin/pip" -q install selenium
      - name: Firefox system proxy with remote DNS against before and after releases
        run: |
          sw_vers
          "$RUNNER_TEMP/webdriver/bin/python" qa/firefox.py
      - name: Save the alternative port in the packaged app and verify it after restarting
        run: |
          ditto -x -k "$RUNNER_TEMP/UnblockPro-$QA_RELEASE-mac-x64.zip" "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/webdriver/bin/pip" -q install playwright
          "$RUNNER_TEMP/webdriver/bin/python" qa/settings.py
      - name: Observe actual YouTube playback and Discord web access from this runner
        if: success() || failure()
        run: '"$RUNNER_TEMP/webdriver/bin/python" qa/services.py'
      - name: Count app elevation requests for real pf and hosts changes and restoration on isolated macOS
        if: success() || failure()
        run: node qa/authorization.js
